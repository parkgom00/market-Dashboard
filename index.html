<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="마켓 대시보드">
  <meta property="og:description" content="캘린더 · 미국장 · 특징주 · 유튜브 · 중장기 · 단기 (참고용 정보, 투자 추천 아님)">
  <title>마켓 대시보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="toprow">
      <h1 id="title">마켓 대시보드</h1>
      <button type="button" class="refresh" id="refresh-all">↻ 새로고침</button>
    </div>
    <div class="updated" id="updated"></div>
  </header>
  <div id="sample-banner" class="banner" hidden>샘플 데이터입니다.</div>

  <main>
    <section id="tab-calendar" class="tab" data-title="마켓 캘린더"></section>
    <section id="tab-us" class="tab" data-title="미국장 &amp; 특징주"></section>
    <section id="tab-live" class="tab" data-title="실시간 특징주"></section>
    <section id="tab-youtube" class="tab" data-title="유튜브 요약"></section>
    <section id="tab-long" class="tab" data-title="중장기 투자"></section>
    <section id="tab-short" class="tab" data-title="단기 트레이딩"></section>
  </main>

  <footer class="disclaimer">
    이 화면은 조건에 맞는 종목을 걸러 보여주는 참고용 정보이며 매수·매도 추천이 아닙니다.
    투자 판단과 손익에 대한 책임은 투자자 본인에게 있습니다.
  </footer>

  <nav class="tabbar" id="tabbar">
    <button data-tab="calendar" aria-label="캘린더"><span class="ico">📅</span><span>캘린더</span></button>
    <button data-tab="us" aria-label="미국장"><span class="ico">🇺🇸</span><span>미국장</span></button>
    <button data-tab="live" aria-label="특징주"><span class="ico">🔥</span><span>특징주</span></button>
    <button data-tab="youtube" aria-label="유튜브"><span class="ico">▶️</span><span>유튜브</span></button>
    <button data-tab="long" aria-label="중장기"><span class="ico">📈</span><span>중장기</span></button>
    <button data-tab="short" aria-label="단기"><span class="ico">⚡</span><span>단기</span></button>
  </nav>

  <script>
    /* 데이터 파일은 주소 뒤에 시각을 붙여 항상 최신본을 받습니다 (브라우저·서버 캐시 때문에 예전 값이 보이는 것 방지).
       순서대로 실행되도록 async=false 로 붙입니다. 파일 하나가 없어도 나머지는 그대로 동작합니다. */
    (function () {
      var t = Date.now();
      ["data/meta.js", "data/calendar.js", "data/usmarket.js", "data/dangjamsa.js", "data/live.js", "data/rotation.js",
       "data/youtube.js", "data/quotes.js", "data/longterm.js", "data/shortterm.js", "app.js"].forEach(function (f) {
        var s = document.createElement("script");
        s.src = f + "?t=" + t;
        s.async = false;
        if (f === "data/live.js") s.id = "live-js";
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
