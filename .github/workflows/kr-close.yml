name: 국내 장마감 (시세 + 중장기 스캔)
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
concurrency:
  group: data-commit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: 국내 시세 수집
        working-directory: scanner
        run: python collect_kr.py
      - name: 중장기 스캔 (국내 전 종목)
        working-directory: scanner
        run: python run_scan.py --market kr
      - name: "[특징주] 뉴스 (네이버 키가 등록된 경우만)"
        continue-on-error: true
        working-directory: scanner
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ -n "$NAVER_CLIENT_ID" ]; then python fetch_news.py; else echo "네이버 키가 없어 뉴스는 건너뜁니다"; fi
      - name: 변경된 데이터 저장
        if: ${{ !cancelled() }}
        run: bash scanner/commit_data.sh
