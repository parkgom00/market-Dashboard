name: 뉴스·공시 (장 전후)
# 장중(09:00~15:50)에는 국내 시세 수집 작업이 10분마다 같이 갱신합니다. 이 작업은 장 전·장 마감 후 뉴스와 공시를 채웁니다.
on:
  schedule:
    - cron: "40 22,23 * * 0-4"     # 07:40, 08:40 KST
    - cron: "10,40 7-12 * * 1-5"   # 16:10 ~ 21:40 KST, 30분 간격
  workflow_dispatch:
concurrency:
  group: data-commit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스·공시 수집
        working-directory: scanner
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python collect_news.py
      - run: bash scanner/commit_data.sh
