name: 국내 장중 갱신 (등락률·거래대금·테마·뉴스)
on:
  schedule:
    - cron: "*/20 0-6 * * 1-5"
  workflow_dispatch:
concurrency:
  group: data-commit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: 국내 시세 수집
        working-directory: scanner
        run: python collect_kr.py
      - name: 변경된 데이터 저장
        if: ${{ !cancelled() }}
        run: bash scanner/commit_data.sh
