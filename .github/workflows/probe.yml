name: 진단 (임시)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: scanner
        run: python probe_flow.py
      - if: ${{ !cancelled() }}
        run: bash scanner/commit_data.sh
