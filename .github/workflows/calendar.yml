name: 캘린더 갱신
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
concurrency:
  group: data-commit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: 지표 결과·실적 예정일 수집 (실패해도 계속)
        working-directory: scanner
        continue-on-error: true
        run: |
          python collect_econ.py
          python collect_earnings.py
      - name: 캘린더 생성
        working-directory: scanner
        run: python build_calendar.py
      - name: 변경된 데이터 저장
        if: ${{ !cancelled() }}
        run: bash scanner/commit_data.sh
