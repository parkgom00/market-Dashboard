name: 유튜브 목록 갱신
on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:
concurrency:
  group: data-commit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 유튜브 최신 영상 수집
        working-directory: scanner
        run: python collect_youtube.py
      - name: 변경된 데이터 저장
        if: ${{ !cancelled() }}
        run: bash scanner/commit_data.sh
