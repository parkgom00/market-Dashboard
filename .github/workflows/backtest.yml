name: 규칙별 과거 성과 점검 (수동 실행)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: 과거 성과 점검
        working-directory: scanner
        run: python backtest.py
      - name: 결과 저장
        if: ${{ !cancelled() }}
        run: bash scanner/commit_data.sh
