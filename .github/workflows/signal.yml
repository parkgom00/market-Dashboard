name: 시장 신호등 (수동 갱신)
# 평소에는 장마감 스캔(16:30)과 미국장 수집(아침) 끝에 자동으로 갱신됩니다. 바로 다시 계산하고 싶을 때만 누르세요.
on:
  workflow_dispatch:
concurrency:
  group: data-commit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: 시장 신호등 계산
        working-directory: scanner
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python market_signal.py --flows
      - run: bash scanner/commit_data.sh
